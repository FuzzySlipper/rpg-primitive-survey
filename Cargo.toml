[package]
name = "rpg-primitive-survey"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded, evidence-oriented surveys of Foundry RPG system data"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
yaml_serde = "0.10.4"

[dev-dependencies]
tempfile = "3.20.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
